name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK build karo
        run: gradle assembleRelease --no-daemon

      - name: APK ka naam theek karo
        run: cp app/build/outputs/apk/release/app-release.apk SpamShield.apk

      - name: APK upload (Actions tab me)
        uses: actions/upload-artifact@v4
        with:
          name: SpamShield-APK
          path: SpamShield.apk

      - name: Release banao (Releases section me seedha download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Spam Shield v1.0.${{ github.run_number }}
          body: "SpamShield.apk download karo aur phone me install karo."
          files: SpamShield.apk
